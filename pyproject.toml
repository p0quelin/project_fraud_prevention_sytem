[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-fraud-sandbox"
version = "0.1.0"
description = "A research sandbox for synthetic payment transactions and fraud detection"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools]
py-modules = ["generator"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
